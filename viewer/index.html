<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fly_icarus two-agent assay</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>fly_icarus</h1>
      <p class="lede">Two agents. Male P1 live. Object frozen. Condition 3 is the rule.</p>
    </header>
    <div id="conds" role="tablist" aria-label="assay conditions"></div>
    <canvas id="arena" width="390" height="280"></canvas>
    <div id="meters">
      <label>P1 <meter id="p1" min="-1" max="1" value="0"></meter> <span id="p1v">0</span></label>
    </div>
    <pre id="hud"></pre>
    <p class="note">Replay of seed-1 frames. The lock is <code>logs/p1_frozen_s1.json</code>.</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
